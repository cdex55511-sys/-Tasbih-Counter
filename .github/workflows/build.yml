name: Build Tasbih APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Tasbih-source.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract source
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('Tasbih-source.zip') as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  p = item.filename
                  if not p.startswith('Tasbih/'):
                      raise ValueError('Unexpected ZIP structure: '+p)
                  relative = p[len('Tasbih/'):]
                  if not relative or '..' in relative.split('/'):
                      raise ValueError('Unsafe ZIP path')
                  import pathlib
                  target = pathlib.Path(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Seal web page
        run: python3 tools/seal.py
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-APK
          path: app/build/outputs/apk/debug/*.apk
          
